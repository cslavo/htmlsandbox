<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>PDF → JPG konvertor</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8b919e;
    --accent: #4f8cff;
    --accent-hover: #3a78f0;
    --success: #2ecc71;
    --error: #e74c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  .hidden-input {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
  .drop-zone {
    display: block;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--panel);
    margin-bottom: 20px;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: #1f242e;
  }
  .drop-zone-icon {
    font-size: 40px;
    line-height: 1;
    margin-bottom: 14px;
    opacity: 0.7;
  }
  .drop-zone-main {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }
  .drop-zone-text { color: var(--muted); font-size: 15px; }

  .file-info {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--success);
    border-radius: 8px;
    padding: 20px 22px;
    margin-bottom: 20px;
    display: none;
  }
  .file-info.visible { display: block; }
  .file-info .label {
    color: var(--success);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .file-info .name {
    color: var(--text);
    font-weight: 600;
    font-size: 18px;
    word-break: break-all;
    line-height: 1.3;
  }
  .file-info .meta {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }

  .options {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
  }
  .option-row label { font-size: 14px; color: var(--text); }
  .option-row .desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .option-row input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    width: 80px;
    font-size: 14px;
  }
  .option-row input[type="range"] { width: 140px; }
  .value-display { color: var(--accent); font-weight: 500; min-width: 40px; text-align: right; }

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { background: #2a3040; color: #555; cursor: not-allowed; }
  button .title { display: block; font-size: 15px; margin-bottom: 4px; }
  button .sub { display: block; font-size: 12px; opacity: 0.85; font-weight: 400; }

  .progress {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-top: 16px;
    display: none;
  }
  .progress.visible { display: block; }
  .progress-bar {
    height: 6px;
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s;
  }
  .progress-text { font-size: 13px; color: var(--muted); }
  .progress-text.success { color: var(--success); }
  .progress-text.error { color: var(--error); }
</style>
</head>
<body>
<div class="container">
  <h1>PDF → JPG konvertor</h1>
  <p class="subtitle">Konvertuje PDF na JPG obrázky. Všetko prebieha lokálne v prehliadači.</p>

  <input type="file" id="fileInput" accept="application/pdf,.pdf" class="hidden-input">
  <label class="drop-zone" id="dropZone" for="fileInput">
    <div class="drop-zone-icon">📄</div>
    <div class="drop-zone-main">Klikni alebo presuň sem PDF súbor</div>
    <div class="drop-zone-text">max ~200 strán pre režim „celé PDF = 1 JPG"</div>
  </label>

  <div class="file-info" id="fileInfo">
    <div class="label">✓ Vybraný súbor</div>
    <div class="name" id="fileName"></div>
    <div class="meta" id="fileMeta"></div>
  </div>

  <div class="options">
    <div class="option-row">
      <div>
        <label for="dpi">Rozlíšenie (DPI)</label>
        <div class="desc">vyššie = ostrejšie, ale pomalšie a väčší súbor</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="range" id="dpiRange" min="72" max="300" value="150" step="6">
        <span class="value-display" id="dpiValue">150</span>
      </div>
    </div>
    <div class="option-row">
      <div>
        <label for="quality">Kvalita JPG</label>
        <div class="desc">0.5 = menší súbor, 1.0 = najlepšia kvalita</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="range" id="qualityRange" min="0.5" max="1.0" value="0.92" step="0.01">
        <span class="value-display" id="qualityValue">0.92</span>
      </div>
    </div>
  </div>

  <div class="buttons">
    <button id="btnPerPage" disabled>
      <span class="title">Strana = JPG</span>
      <span class="sub">každá strana ako samostatný súbor (ZIP)</span>
    </button>
    <button id="btnSingle" disabled>
      <span class="title">Celé PDF = 1 JPG</span>
      <span class="sub">všetky strany v jednom vysokom obrázku</span>
    </button>
  </div>

  <div class="progress" id="progress">
    <div class="progress-text" id="progressText">Pripravujem...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";

  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");
  const fileInfo = document.getElementById("fileInfo");
  const fileName = document.getElementById("fileName");
  const fileMeta = document.getElementById("fileMeta");
  const btnPerPage = document.getElementById("btnPerPage");
  const btnSingle = document.getElementById("btnSingle");
  const progress = document.getElementById("progress");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");
  const dpiRange = document.getElementById("dpiRange");
  const dpiValue = document.getElementById("dpiValue");
  const qualityRange = document.getElementById("qualityRange");
  const qualityValue = document.getElementById("qualityValue");

  let pdfDoc = null;
  let currentFileName = "";

  dpiRange.addEventListener("input", () => dpiValue.textContent = dpiRange.value);
  qualityRange.addEventListener("input", () => qualityValue.textContent = qualityRange.value);

  ["dragover", "dragenter"].forEach(ev => {
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add("dragover"); });
  });
  ["dragleave", "drop"].forEach(ev => {
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove("dragover"); });
  });
  dropZone.addEventListener("drop", e => {
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });
  fileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (file) handleFile(file);
  });

  async function handleFile(file) {
    if (!file.type.includes("pdf") && !file.name.toLowerCase().endsWith(".pdf")) {
      showStatus("Vyber prosím PDF súbor.", "error");
      return;
    }
    currentFileName = file.name.replace(/\.pdf$/i, "");
    showStatus("Načítavam PDF...", "");
    progress.classList.add("visible");
    try {
      const buffer = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: buffer }).promise;
      fileName.textContent = file.name;
      fileMeta.textContent = `${pdfDoc.numPages} strán · ${(file.size / 1024 / 1024).toFixed(2)} MB`;
      fileInfo.classList.add("visible");
      btnPerPage.disabled = false;
      btnSingle.disabled = false;
      showStatus(`Pripravené. ${pdfDoc.numPages} strán načítaných.`, "success");
    } catch (err) {
      showStatus("Chyba pri čítaní PDF: " + err.message, "error");
      console.error(err);
    }
  }

  function showStatus(text, kind) {
    progress.classList.add("visible");
    progressText.textContent = text;
    progressText.className = "progress-text" + (kind ? " " + kind : "");
  }
  function setProgressPct(pct) { progressFill.style.width = pct + "%"; }

  function dpiToScale(dpi) { return dpi / 72; }

  async function renderPageToCanvas(pageNum, scale) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport, background: "white" }).promise;
    return canvas;
  }

  function canvasToBlob(canvas, quality) {
    return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  btnPerPage.addEventListener("click", async () => {
    if (!pdfDoc) return;
    const scale = dpiToScale(parseInt(dpiRange.value));
    const quality = parseFloat(qualityRange.value);
    const total = pdfDoc.numPages;
    btnPerPage.disabled = true; btnSingle.disabled = true;
    setProgressPct(0);
    try {
      const zip = new JSZip();
      const padLen = String(total).length;
      for (let i = 1; i <= total; i++) {
        showStatus(`Renderujem stranu ${i}/${total}...`, "");
        const canvas = await renderPageToCanvas(i, scale);
        const blob = await canvasToBlob(canvas, quality);
        const name = `${currentFileName}_strana_${String(i).padStart(padLen, "0")}.jpg`;
        zip.file(name, blob);
        setProgressPct((i / total) * 90);
      }
      showStatus("Vytváram ZIP...", "");
      const zipBlob = await zip.generateAsync({ type: "blob" }, meta => {
        setProgressPct(90 + meta.percent * 0.1);
      });
      downloadBlob(zipBlob, `${currentFileName}_strany.zip`);
      setProgressPct(100);
      showStatus(`Hotovo. ${total} JPG súborov v ZIP archíve.`, "success");
    } catch (err) {
      showStatus("Chyba: " + err.message, "error");
      console.error(err);
    } finally {
      btnPerPage.disabled = false; btnSingle.disabled = false;
    }
  });

  btnSingle.addEventListener("click", async () => {
    if (!pdfDoc) return;
    const scale = dpiToScale(parseInt(dpiRange.value));
    const quality = parseFloat(qualityRange.value);
    const total = pdfDoc.numPages;
    btnPerPage.disabled = true; btnSingle.disabled = true;
    setProgressPct(0);
    try {
      showStatus("Meriam strany...", "");
      const pageCanvases = [];
      let maxWidth = 0;
      let totalHeight = 0;
      for (let i = 1; i <= total; i++) {
        showStatus(`Renderujem stranu ${i}/${total}...`, "");
        const canvas = await renderPageToCanvas(i, scale);
        pageCanvases.push(canvas);
        if (canvas.width > maxWidth) maxWidth = canvas.width;
        totalHeight += canvas.height;
        setProgressPct((i / total) * 80);
      }

      const MAX_DIM = 16384;
      let finalScale = 1;
      if (maxWidth > MAX_DIM || totalHeight > MAX_DIM) {
        finalScale = Math.min(MAX_DIM / maxWidth, MAX_DIM / totalHeight);
        showStatus(`Veľký obrázok — zmenšujem na ${Math.round(finalScale * 100)}%...`, "");
      }

      const finalW = Math.floor(maxWidth * finalScale);
      const finalH = Math.floor(totalHeight * finalScale);
      const finalCanvas = document.createElement("canvas");
      finalCanvas.width = finalW;
      finalCanvas.height = finalH;
      const ctx = finalCanvas.getContext("2d");
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, finalW, finalH);

      let y = 0;
      for (let i = 0; i < pageCanvases.length; i++) {
        const c = pageCanvases[i];
        const w = Math.floor(c.width * finalScale);
        const h = Math.floor(c.height * finalScale);
        const x = Math.floor((finalW - w) / 2);
        ctx.drawImage(c, x, y, w, h);
        y += h;
        setProgressPct(80 + ((i + 1) / pageCanvases.length) * 15);
      }

      showStatus("Exportujem JPG...", "");
      const blob = await canvasToBlob(finalCanvas, quality);
      if (!blob) throw new Error("Obrázok je príliš veľký pre prehliadač. Skús nižšie DPI.");
      downloadBlob(blob, `${currentFileName}_cele.jpg`);
      setProgressPct(100);
      showStatus(`Hotovo. Rozmer ${finalW}×${finalH} px, ${(blob.size / 1024 / 1024).toFixed(2)} MB.`, "success");
    } catch (err) {
      showStatus("Chyba: " + err.message, "error");
      console.error(err);
    } finally {
      btnPerPage.disabled = false; btnSingle.disabled = false;
    }
  });
</script>
</body>
</html>
